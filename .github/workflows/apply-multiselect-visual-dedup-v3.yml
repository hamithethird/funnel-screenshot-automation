name: Apply multi-select visual dedup v3

on:
  push:
    paths:
      - '.github/multiselect-visual-dedup-v3-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/patch_multiselect_visual_dedup.py
      - name: Syntax check
        run: node --check funnel-crawler-multiscreen.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add funnel-crawler-multiscreen.js
          if git diff --cached --quiet; then
            echo "No crawler changes needed"
          else
            git commit -m "Deduplicate multi-select selection-state screenshots"
            git push origin main
          fi
