name: Apply branch outcome dedup v1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/trigger-branch-outcome-dedup-v1.txt'
      - '.github/workflows/apply-branch-outcome-dedup-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch crawler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('funnel-crawler-multiscreen.js')
          s = p.read_text()
          marker = "  function branchProbeIndexes(optionCount, maxProbe = 4) {\n"
          helper = r'''  function branchOutcomeEquivalent(a, b) {
    if (!a || !b) return false;
    if (a.screenshotBuffer && b.screenshotBuffer && Buffer.isBuffer(a.screenshotBuffer) && Buffer.isBuffer(b.screenshotBuffer) && a.screenshotBuffer.equals(b.screenshotBuffer)) return true;
    const textA = a.fingerprint || normalizeContextText(a.landingState?.pageText || '');
    const textB = b.fingerprint || normalizeContextText(b.landingState?.pageText || '');
    if (!textA || !textB) return false;
    const similarity = contextSimilarity(textA, textB);
    if (similarity >= 0.985) return true;
    const numericClaims = text => (text.match(/\b\d+(?:[.,]\d+)?%?\b/g) || []).join('|');
    if (similarity >= 0.955 && numericClaims(textA) === numericClaims(textB)) return true;
    return false;
  }

  function uniqueBranchOutcomeGroups(outcomes) {
    const groups = [];
    for (const outcome of outcomes) {
      let group = groups.find(item => branchOutcomeEquivalent(item, outcome));
      if (!group) {
        group = { ...outcome, answers: [], answerSets: [] };
        groups.push(group);
      }
      if (outcome.optionText) group.answers.push(outcome.optionText);
      if (outcome.answers) group.answerSets.push(outcome.answers);
    }
    return groups;
  }

'''
          if 'function branchOutcomeEquivalent(a, b)' not in s:
              if marker not in s: raise SystemExit('branchProbeIndexes marker not found')
              s = s.replace(marker, helper + marker, 1)
          s = s.replace("    let probeFingerprints = new Set(outcomes.map(x => x.fingerprint));\n", "    let probeFingerprints = new Set(uniqueBranchOutcomeGroups(outcomes).map((_, i) => String(i)));\n", 1)
          s = s.replace("      probeFingerprints = new Set(outcomes.map(x => x.fingerprint));\n", "      probeFingerprints = new Set(uniqueBranchOutcomeGroups(outcomes).map((_, i) => String(i)));\n", 1)
          old1 = r'''    const uniqueOutcomes = [];
    for (const outcome of outcomes) {
      let existing = uniqueOutcomes.find(item => item.fingerprint === outcome.fingerprint);
      if (!existing) {
        existing = { ...outcome, answers: [outcome.optionText] };
        uniqueOutcomes.push(existing);
      } else {
        existing.answers.push(outcome.optionText);
      }
    }
'''
          if old1 in s: s = s.replace(old1, "    const uniqueOutcomes = uniqueBranchOutcomeGroups(outcomes);\n", 1)
          old2 = r'''    const uniqueOutcomes = [];
    for (const outcome of outcomes) {
      let existing = uniqueOutcomes.find(item => item.fingerprint === outcome.fingerprint);
      if (!existing) {
        existing = { ...outcome, answerSets: [outcome.answers] };
        uniqueOutcomes.push(existing);
      } else {
        existing.answerSets.push(outcome.answers);
      }
    }
'''
          if old2 in s: s = s.replace(old2, "    const uniqueOutcomes = uniqueBranchOutcomeGroups(outcomes);\n", 1)
          p.write_text(s)
          PY
          node --check funnel-crawler-multiscreen.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then echo 'No changes to commit.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add funnel-crawler-multiscreen.js
          git commit -m 'Deduplicate equivalent branch outcomes before confirming branches'
          git push
