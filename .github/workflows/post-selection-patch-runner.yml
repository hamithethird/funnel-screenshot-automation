name: Post-selection patch runner

on:
  push:
    paths:
      - '.github/post-selection-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/patch_post_selection.py
      - name: Syntax check
        run: node --check funnel-crawler-multiscreen.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add funnel-crawler-multiscreen.js
          git commit -m "Wait for stable screens after selections" || exit 0
          git push origin main
