name: Apply age-card selection v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch crawler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('funnel-crawler-multiscreen.js')
          s = p.read_text()
          marker = "  async function handleExplicitAgeSelection(state) {\n"
          if marker not in s:
              raise SystemExit('handleExplicitAgeSelection marker not found')
          if 'Age-range choice page detected from answer options.' not in s:
              block = '''    // Age can be a card/choice task, not only a writable numeric input.\n    // If most answer choices are age ranges, choose the range containing age 25\n    // before speech detection, branch probing, or numeric-input handling.\n    const ageRangeOptions = (state?.group || []).map(option => {\n      const raw = (option.text || '').trim();\n      const normalized = raw.replace(/[–—]/g, '-');\n      const range = normalized.match(/(?:age\\s*:\\s*)?(\\d{1,3})\\s*-\\s*(\\d{1,3})/i);\n      const plus = normalized.match(/(?:age\\s*:\\s*)?(\\d{1,3})\\s*\\+/i);\n      if (range) return { option, min: Number(range[1]), max: Number(range[2]), raw };\n      if (plus) return { option, min: Number(plus[1]), max: Infinity, raw };\n      return null;\n    }).filter(Boolean);\n\n    if (ageRangeOptions.length >= 2 && ageRangeOptions.length >= Math.ceil((state?.group?.length || 0) * 0.6)) {\n      const targetAge = 25;\n      const chosen = ageRangeOptions.find(item => targetAge >= item.min && targetAge <= item.max) || ageRangeOptions[0];\n      console.log(`Age-range choice page detected from answer options. Choosing the range containing age ${targetAge}:`, chosen.raw);\n      const beforeSignature = pageSignature(state);\n      const clicked = await safeCrawlerClick(\n        page.locator(`[data-auto-id="${chosen.option.id}"]`),\n        chosen.raw || 'age-range option'\n      );\n      if (!clicked) return { handled: true, advanced: false };\n      if (await waitForAdvancement(beforeSignature, 12000)) return { handled: true, advanced: true };\n      const afterSelection = await inspectPageNavigationSafe('age-range choice post-click');\n      const nav = await clickStrongNavigation(afterSelection, 'age-range selection navigation CTA');\n      if (nav.handled) return { handled: true, advanced: nav.advanced };\n      return { handled: true, advanced: false };\n    }\n\n'''
              s = s.replace(marker, marker + block, 1)
          p.write_text(s)
          PY
          node --check funnel-crawler-multiscreen.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add funnel-crawler-multiscreen.js
          git commit -m 'Treat age ranges as selectable age tasks'
          git push
