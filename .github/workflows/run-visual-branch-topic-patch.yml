name: Run visual branch topic patch

on:
  push:
    paths:
      - '.github/workflows/run-visual-branch-topic-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/patch_visual_branch_topic.py
      - name: Syntax check
        run: node --check funnel-crawler-multiscreen.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add funnel-crawler-multiscreen.js
          git commit -m "Capture same-page visual states and infer funnel topics" || exit 0
          git push origin main
