name: Apply email collision retry v1

on:
  push:
    paths:
      - '.github/email-collision-retry-v1-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/patch_email_collision_retry_v1.py
      - name: Syntax check
        run: node --check funnel-crawler-multiscreen.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add funnel-crawler-multiscreen.js
          if git diff --cached --quiet; then
            echo "No crawler changes needed"
          else
            git commit -m "Retry email when address is already used"
            git push origin main
          fi
