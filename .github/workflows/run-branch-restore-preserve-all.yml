name: Run branch restore preservation patch

on:
  push:
    paths:
      - '.github/workflows/run-branch-restore-preserve-all.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/apply_branch_restore_preserve_all.py
      - name: Syntax check
        run: node --check funnel-crawler-multiscreen.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add funnel-crawler-multiscreen.js
          git commit -m "Preserve numbered screenshots after branch restore failures" || exit 0
          git push origin main
