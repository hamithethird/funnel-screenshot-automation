name: Apply foreground form priority patch

on:
  push:
    paths:
      - '.github/workflows/apply-foreground-form-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch crawler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('funnel-crawler-multiscreen.js')
          s = p.read_text()

          old = '''    const scratchResult = await handleScratchReveal(screenNumber, state);\n    if (scratchResult.handled) return scratchResult.advanced;\n\n    const navigationResult = await clickStrongNavigation(state);\n    if (navigationResult.handled) return navigationResult.advanced;\n\n    state = await inspectPage();\n    if (state.group.length > 0) return await handleAnswerGroup(state, screenNumber);\n    const formResult = await handleGenericFormInput(state);\n    if (formResult.recognized) return formResult.advanced;\n'''

          new = '''    const scratchResult = await handleScratchReveal(screenNumber, state);\n    if (scratchResult.handled) return scratchResult.advanced;\n\n    // Foreground forms must outrank navigation controls that may still exist\n    // behind an overlay (for example, an email gate covering a prior Continue button).\n    const formResult = await handleGenericFormInput(state);\n    if (formResult.recognized) return formResult.advanced;\n\n    const navigationResult = await clickStrongNavigation(state);\n    if (navigationResult.handled) return navigationResult.advanced;\n\n    state = await inspectPage();\n    if (state.group.length > 0) return await handleAnswerGroup(state, screenNumber);\n'''

          if old not in s:
              raise SystemExit('Could not find advanceOneScreen block to patch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check funnel-crawler-multiscreen.js
      - name: Commit crawler change
        run: |
          if git diff --quiet -- funnel-crawler-multiscreen.js; then
            echo "No crawler changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add funnel-crawler-multiscreen.js
          git commit -m "Prioritize foreground forms over background navigation"
          git push origin HEAD:main
