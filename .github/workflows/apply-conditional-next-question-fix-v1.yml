name: Apply conditional next question fix v1
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch crawler
        run: python3 .github/scripts/patch_conditional_next_question.py
      - name: Check syntax
        run: node --check funnel-crawler-multiscreen.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add funnel-crawler-multiscreen.js
          git commit -m 'Classify conditional next questions separately from transitions'
          git push
