name: Apply conditional next question fix v1
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch conditional next-question classification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('funnel-crawler-multiscreen.js')
          s = p.read_text()

          marker = "    const uniqueOutcomes = uniqueBranchOutcomeGroups(outcomes);\n\n    if (uniqueOutcomes.length <= 1) {"
          if marker not in s:
              if 'Conditional next-question variants detected:' in s:
                  raise SystemExit(0)
              raise SystemExit('single-select unique outcome marker not found')

          insert = '''    const uniqueOutcomes = uniqueBranchOutcomeGroups(outcomes);\n\n    // Distinguish true transition pages from answer-dependent NEXT QUESTIONS.\n    // If every distinct immediate landing page already contains another real\n    // answer group, those pages belong to the next numbered step (08/08a/08b...),\n    // not to the source question as 07a/07b transition screenshots.\n    const allOutcomesAreNextQuestions = uniqueOutcomes.length > 1 &&\n      uniqueOutcomes.every(item => Array.isArray(item.landingState?.group) && item.landingState.group.length >= 2);\n\n    if (allOutcomesAreNextQuestions) {\n      const nextScreenNumber = screenNumber + 1;\n      const baselineAnswer = optionTexts[0];\n      const baselineGroupIndex = uniqueOutcomes.findIndex(item => (item.answers || []).includes(baselineAnswer));\n      const baselineIndex = baselineGroupIndex >= 0 ? baselineGroupIndex : 0;\n      const alternates = uniqueOutcomes.filter((_, index) => index !== baselineIndex);\n\n      console.log(`Conditional next-question variants detected: ${uniqueOutcomes.length} distinct answer-dependent versions of the next question.`);\n      console.log(`The normal main-path version will be captured as ${String(nextScreenNumber).padStart(2, '0')}.png; only alternate next-question versions will receive lettered screenshots.`);\n\n      for (let i = 0; i < alternates.length; i++) {\n        const filename = path.join(OUTPUT_DIR, `${String(nextScreenNumber).padStart(2, '0')}${branchLetter(i)}.png`);\n        fs.writeFileSync(filename, alternates[i].screenshotBuffer);\n        console.log(`Captured ${path.basename(filename)} as an alternate next-question version for answer(s): ${(alternates[i].answers || []).join(' | ')}`);\n      }\n\n      const restored = await restoreQuestionPage(questionUrl, optionTexts, questionFingerprint);\n      if (!restored) {\n        console.log('Could not restore the source question after collecting next-question variants. Preserving the current landing question for the next numbered screenshot.');\n        return true;\n      }\n\n      const finalResult = await chooseBranchOptionAndAdvance(optionTexts[0], screenNumber, questionState);\n      // Important: do NOT set skipNextNumberedFingerprint here. The landing page\n      // is a real next question and must receive the next numbered screenshot.\n      return !!finalResult.advanced;\n    }\n\n    if (uniqueOutcomes.length <= 1) {'''
          s = s.replace(marker, insert, 1)

          marker2 = "    const uniqueOutcomes = uniqueBranchOutcomeGroups(outcomes);\n\n    if (uniqueOutcomes.length > 1) {\n      console.log(`Conditional multi-select branching confirmed: ${uniqueOutcomes.length} unique next pages found.`);"
          if marker2 in s:
              insert2 = '''    const uniqueOutcomes = uniqueBranchOutcomeGroups(outcomes);\n\n    const allMultiOutcomesAreNextQuestions = uniqueOutcomes.length > 1 &&\n      uniqueOutcomes.every(item => Array.isArray(item.landingState?.group) && item.landingState.group.length >= 2);\n\n    if (allMultiOutcomesAreNextQuestions) {\n      const nextScreenNumber = screenNumber + 1;\n      const baselineSet = testSets[0] || [];\n      const baselineGroupIndex = uniqueOutcomes.findIndex(item =>\n        (item.answerSets || []).some(set => JSON.stringify(set) === JSON.stringify(baselineSet))\n      );\n      const baselineIndex = baselineGroupIndex >= 0 ? baselineGroupIndex : 0;\n      const alternates = uniqueOutcomes.filter((_, index) => index !== baselineIndex);\n\n      console.log(`Conditional next-question variants detected: ${uniqueOutcomes.length} distinct answer-dependent versions of the next question.`);\n      console.log(`The normal main-path version will be captured as ${String(nextScreenNumber).padStart(2, '0')}.png; only alternate next-question versions will receive lettered screenshots.`);\n\n      for (let i = 0; i < alternates.length; i++) {\n        const filename = path.join(OUTPUT_DIR, `${String(nextScreenNumber).padStart(2, '0')}${branchLetter(i)}.png`);\n        fs.writeFileSync(filename, alternates[i].screenshotBuffer);\n        console.log(`Captured ${path.basename(filename)} as an alternate next-question version for selection set(s): ${(alternates[i].answerSets || []).map(set => set.join(' + ')).join(' | ')}`);\n      }\n\n      const restored = await restoreQuestionPage(questionUrl, optionTexts, questionFingerprint);\n      if (!restored) {\n        console.log('Could not restore the multi-select source question after collecting next-question variants. Preserving the current landing question for the next numbered screenshot.');\n        return true;\n      }\n\n      const finalResult = await chooseMultiSelectSetAndAdvance(testSets[0], screenNumber, state);\n      return !!finalResult.advanced;\n    }\n\n    if (uniqueOutcomes.length > 1) {\n      console.log(`Conditional multi-select branching confirmed: ${uniqueOutcomes.length} unique next pages found.`);'''
              s = s.replace(marker2, insert2, 1)

          p.write_text(s)
          PY
          node --check funnel-crawler-multiscreen.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add funnel-crawler-multiscreen.js
          git commit -m 'Classify conditional next questions separately from transitions'
          git push
# retrigger 2026-08-26
